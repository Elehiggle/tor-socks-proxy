name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native image
        shell: bash
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          docker build --pull \
            --label org.opencontainers.image.source=https://github.com/Elehiggle/tor-socks-proxy \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --tag "elehiggle/tor-socks-proxy:sha-$SOURCE_REVISION" .
      - name: Run offline image and updater checks
        shell: bash
        run: sh scripts/ci-smoke.sh "elehiggle/tor-socks-proxy:sha-$SOURCE_REVISION"
